<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- پس‌زمینه گرد -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- چرخدنده صنعتی / نماد قطعات خودرو -->
  <g transform="translate(256, 256)">
    <circle r="140" fill="none" stroke="url(#cogGrad)" stroke-width="28" stroke-dasharray="32 18"/>
    <circle r="100" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
    
    <!-- حرف فارسی ک (کاردو) -->
    <text x="0" y="32" font-family="Tahoma, Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">ک</text>
  </g>
  
  <!-- برچسب B2B -->
  <rect x="186" y="400" width="140" height="44" rx="22" fill="#ea580c"/>
  <text x="256" y="428" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">B2B KARDO</text>
</svg>
