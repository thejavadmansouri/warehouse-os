<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c0392b">
  <title>قطعات خودرو | انبار OS</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
:root{--c-bg:#f5f3ef;--c-surface:#fff;--c-surface-2:#eae7e1;--c-border:#d4d0c9;--c-text:#1a1a1a;--c-text-2:#5c5c5c;--c-text-3:#9a9a9a;--c-accent:#c0392b;--c-accent-hover:#a93226;--c-success:#27ae60;--c-warning:#f39c12;--c-badge:#e74c3c;--ff:'Vazirmatn','Tahoma',sans-serif;--fs-xs:.75rem;--fs-sm:.875rem;--fs-md:1rem;--fs-lg:1.125rem;--fs-xl:1.5rem;--fs-2xl:2rem;--fw-normal:400;--fw-medium:500;--fw-bold:700;--sp-1:.25rem;--sp-2:.5rem;--sp-3:.75rem;--sp-4:1rem;--sp-6:1.5rem;--sp-8:2rem;--sp-12:3rem;--sp-16:4rem;--r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:9999px;--sh-sm:0 1px 2px rgba(0,0,0,.06);--sh-md:0 2px 8px rgba(0,0,0,.08);--sh-lg:0 4px 16px rgba(0,0,0,.10);--sh-xl:0 8px 32px rgba(0,0,0,.12);--max-w:1280px;--header-h:64px;--cart-w:380px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--c-bg);color:var(--c-text);line-height:1.6;direction:rtl;min-height:100dvh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}
input,select{font-family:inherit}

.header{position:sticky;top:0;z-index:100;height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 var(--sp-4);gap:var(--sp-4);box-shadow:var(--sh-sm)}
.header__logo{display:flex;align-items:center;gap:var(--sp-2);font-weight:var(--fw-bold);font-size:var(--fs-lg);color:var(--c-accent);flex-shrink:0}
.header__logo svg{width:28px;height:28px}
.header__search{flex:1;max-width:520px;position:relative}
.header__search input{width:100%;height:42px;padding:0 var(--sp-8) 0 var(--sp-4);border:1px solid var(--c-border);border-radius:var(--r-full);background:var(--c-bg);font-size:var(--fs-sm);color:var(--c-text);transition:border-color .15s;outline:none}
.header__search input:focus{border-color:var(--c-accent)}
.header__search-icon{position:absolute;right:var(--sp-3);top:50%;transform:translateY(-50%);color:var(--c-text-3);pointer-events:none}
.header__actions{display:flex;align-items:center;gap:var(--sp-3);flex-shrink:0}
.header__cart-btn{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-full);transition:background .15s}
.header__cart-btn:hover{background:var(--c-surface-2)}
.header__cart-badge{position:absolute;top:2px;left:2px;min-width:18px;height:18px;padding:0 4px;background:var(--c-badge);color:#fff;font-size:11px;font-weight:var(--fw-bold);border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;line-height:1}
.header__cart-badge:empty{display:none}

.cat-bar{background:var(--c-surface);border-bottom:1px solid var(--c-border);overflow-x:auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-bar__inner{display:flex;gap:var(--sp-1);padding:var(--sp-2) var(--sp-4);max-width:var(--max-w);margin:0 auto;width:max-content}
.cat-bar__chip{padding:var(--sp-2) var(--sp-4);border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:var(--fw-medium);white-space:nowrap;background:var(--c-surface-2);color:var(--c-text-2);transition:all .15s;border:1px solid transparent}
.cat-bar__chip:hover{background:var(--c-border);color:var(--c-text)}
.cat-bar__chip.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}

.main{max-width:var(--max-w);margin:0 auto;padding:var(--sp-4)}
.products-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)}
.products-header__count{font-size:var(--fs-sm);color:var(--c-text-3)}
.products-header__sort select{height:36px;padding:0 var(--sp-3);border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface);font-size:var(--fs-sm);color:var(--c-text);cursor:pointer}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-4)}

.p-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);overflow:hidden;transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column}
.p-card:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
.p-card__img{aspect-ratio:4/3;background:var(--c-surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.p-card__img-placeholder{color:var(--c-text-3);font-size:var(--fs-2xl);user-select:none}
.p-card__stock-badge{position:absolute;top:var(--sp-2);right:var(--sp-2);padding:2px 8px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:var(--fw-bold)}
.p-card__stock-badge.in-stock{background:#d4edda;color:#155724}
.p-card__stock-badge.low-stock{background:#fff3cd;color:#856404}
.p-card__stock-badge.out-of-stock{background:#f8d7da;color:#721c24}
.p-card__body{padding:var(--sp-3) var(--sp-4) var(--sp-4);display:flex;flex-direction:column;flex:1}
.p-card__brand{font-size:var(--fs-xs);color:var(--c-text-3);letter-spacing:.5px;margin-bottom:var(--sp-1)}
.p-card__name{font-size:var(--fs-md);font-weight:var(--fw-medium);line-height:1.4;margin-bottom:var(--sp-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.p-card__sku{font-size:var(--fs-xs);color:var(--c-text-3);margin-bottom:var(--sp-2);direction:ltr;text-align:right}
.p-card__footer{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-top:auto}
.p-card__price{font-size:var(--fs-lg);font-weight:var(--fw-bold);color:var(--c-accent);white-space:nowrap}
.p-card__price-unit{font-size:var(--fs-xs);color:var(--c-text-3);font-weight:var(--fw-normal)}
.p-card__add-btn{width:40px;height:40px;border-radius:var(--r-full);background:var(--c-accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s}
.p-card__add-btn:hover{background:var(--c-accent-hover);transform:scale(1.1)}
.p-card__add-btn:active{transform:scale(.95)}
.p-card__add-btn.added{background:var(--c-success)}
.p-card.out-of-stock{opacity:.6}
.p-card.out-of-stock .p-card__add-btn{background:var(--c-text-3);pointer-events:none}

.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.cart-overlay.open{opacity:1;visibility:visible}
.cart-drawer{position:fixed;top:0;left:0;width:min(var(--cart-w),90vw);height:100dvh;background:var(--c-surface);z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-xl)}
.cart-drawer.open{transform:translateX(0)}
.cart-drawer__header{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-4);border-bottom:1px solid var(--c-border)}
.cart-drawer__title{font-size:var(--fs-lg);font-weight:var(--fw-bold)}
.cart-drawer__close{width:36px;height:36px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;transition:background .15s}
.cart-drawer__close:hover{background:var(--c-surface-2)}
.cart-drawer__items{flex:1;overflow-y:auto;padding:var(--sp-2) var(--sp-4)}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--c-text-3);gap:var(--sp-3);text-align:center;padding:var(--sp-8)}
.cart-empty svg{opacity:.3}
.cart-item{display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--c-surface-2)}
.cart-item:last-child{border-bottom:none}
.cart-item__img{width:60px;height:60px;border-radius:var(--r-md);background:var(--c-surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cart-item__info{flex:1;min-width:0}
.cart-item__name{font-size:var(--fs-sm);font-weight:var(--fw-medium);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cart-item__price{font-size:var(--fs-sm);color:var(--c-accent);font-weight:var(--fw-bold);margin-top:var(--sp-1)}
.cart-item__controls{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.cart-qty-btn{width:28px;height:28px;border-radius:var(--r-full);border:1px solid var(--c-border);display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);font-weight:var(--fw-bold);color:var(--c-text);transition:background .15s}
.cart-qty-btn:hover{background:var(--c-surface-2)}
.cart-item__qty{font-size:var(--fs-md);font-weight:var(--fw-bold);min-width:24px;text-align:center}
.cart-item__remove{color:var(--c-text-3);font-size:var(--fs-sm);transition:color .15s}
.cart-item__remove:hover{color:var(--c-badge)}
.cart-drawer__footer{padding:var(--sp-4);border-top:1px solid var(--c-border);background:var(--c-surface)}
.cart-summary{display:flex;flex-direction:column;gap:var(--sp-2);margin-bottom:var(--sp-4)}
.cart-summary__row{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--c-text-2)}
.cart-summary__row.total{font-size:var(--fs-lg);font-weight:var(--fw-bold);color:var(--c-text);padding-top:var(--sp-2);border-top:1px solid var(--c-border)}
.checkout-btn{width:100%;height:48px;border-radius:var(--r-lg);background:var(--c-accent);color:#fff;font-size:var(--fs-md);font-weight:var(--fw-bold);transition:background .15s}
.checkout-btn:hover{background:var(--c-accent-hover)}

.toast{position:fixed;bottom:var(--sp-6);left:50%;transform:translateX(-50%) translateY(120%);background:var(--c-text);color:#fff;padding:var(--sp-3) var(--sp-6);border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:var(--fw-medium);z-index:300;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;padding:var(--sp-4)}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:var(--c-surface);border-radius:var(--r-xl);width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;box-shadow:var(--sh-xl);transform:scale(.95);transition:transform .2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal__header{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--c-border)}
.modal__title{font-size:var(--fs-lg);font-weight:var(--fw-bold)}
.modal__body{padding:var(--sp-6)}
.modal__footer{padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--c-border);display:flex;gap:var(--sp-3)}
.form-group{margin-bottom:var(--sp-4)}
.form-group label{display:block;font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--c-text-2);margin-bottom:var(--sp-1)}
.form-group input,.form-group select{width:100%;height:42px;padding:0 var(--sp-3);border:1px solid var(--c-border);border-radius:var(--r-md);font-size:var(--fs-sm);background:var(--c-surface);color:var(--c-text);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--c-accent)}
.btn-primary{height:42px;padding:0 var(--sp-6);border-radius:var(--r-md);background:var(--c-accent);color:#fff;font-size:var(--fs-sm);font-weight:var(--fw-bold);transition:background .15s;flex:1}
.btn-primary:hover{background:var(--c-accent-hover)}
.btn-secondary{height:42px;padding:0 var(--sp-6);border-radius:var(--r-md);background:var(--c-surface-2);color:var(--c-text);font-size:var(--fs-sm);font-weight:var(--fw-medium);transition:background .15s}
.btn-secondary:hover{background:var(--c-border)}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--c-surface);border-top:1px solid var(--c-border);z-index:90;padding:0 var(--sp-4)}
.mobile-nav__item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--c-text-3)}
.mobile-nav__item.active{color:var(--c-accent)}
.footer{margin-top:var(--sp-16);padding:var(--sp-8) var(--sp-4);background:var(--c-surface);border-top:1px solid var(--c-border);text-align:center;color:var(--c-text-3);font-size:var(--fs-sm)}
.empty-state{grid-column:1/-1;text-align:center;padding:var(--sp-16) var(--sp-4);color:var(--c-text-3)}
.empty-state__icon{font-size:3rem;margin-bottom:var(--sp-4);opacity:.3}
.empty-state__text{font-size:var(--fs-lg)}

@media(max-width:640px){.header__logo span{display:none}.product-grid{grid-template-columns:repeat(2,1fr);gap:var(--sp-2)}.p-card__body{padding:var(--sp-2) var(--sp-3) var(--sp-3)}.p-card__name{font-size:var(--fs-sm)}.p-card__price{font-size:var(--fs-md)}.p-card__add-btn{width:36px;height:36px}.mobile-nav{display:flex;align-items:center;justify-content:space-around}body{padding-bottom:56px}}
@media(min-width:641px) and (max-width:1024px){.product-grid{grid-template-columns:repeat(3,1fr)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:var(--r-full)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.product-grid .p-card{animation:fadeIn .3s ease both}
.product-grid .p-card:nth-child(2){animation-delay:.05s}
.product-grid .p-card:nth-child(3){animation-delay:.1s}
.product-grid .p-card:nth-child(4){animation-delay:.15s}
.product-grid .p-card:nth-child(5){animation-delay:.2s}
.product-grid .p-card:nth-child(6){animation-delay:.25s}
  </style>
</head>
<body>

<header class="header">
  <a href="/" class="header__logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
    <span>قطعات خودرو</span>
  </a>
  <div class="header__search">
    <svg class="header__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="جستجوی محصول، برند یا شماره فنی..." autocomplete="off">
  </div>
  <div class="header__actions">
    <button class="header__cart-btn" id="cartBtn" aria-label="سبد خرید">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span class="header__cart-badge" id="cartBadge"></span>
    </button>
  </div>
</header>

<nav class="cat-bar"><div class="cat-bar__inner" id="catBar"><button class="cat-bar__chip active" data-cat="all">همه</button></div></nav>

<main class="main">
  <div class="products-header">
    <span class="products-header__count" id="productsCount"></span>
    <div class="products-header__sort"><select id="sortSelect"><option value="newest">جدیدترین</option><option value="cheapest">ارزان‌ترین</option><option value="expensive">گران‌ترین</option><option value="name">نام</option></select></div>
  </div>
  <div class="product-grid" id="productGrid"></div>
</main>

<footer class="footer"><p>فروشگاه قطعات خودرو — تمامی حقوق محفوظ است</p></footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer__header"><h2 class="cart-drawer__title">سبد خرید</h2><button class="cart-drawer__close" id="cartClose" aria-label="بستن"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="cart-drawer__items" id="cartItems"><div class="cart-empty" id="cartEmpty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><p>سبد خرید خالی است</p></div></div>
  <div class="cart-drawer__footer" id="cartFooter" style="display:none;"><div class="cart-summary"><div class="cart-summary__row"><span>جمع کل</span><span id="cartSubtotal">۰</span></div><div class="cart-summary__row total"><span>قابل پرداخت</span><span id="cartTotal">۰ تومان</span></div></div><button class="checkout-btn" id="checkoutBtn">تسویه و خرید</button></div>
</aside>

<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <div class="modal__header"><h3 class="modal__title">تسویه خرید</h3><button class="cart-drawer__close" id="checkoutClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="modal__body">
      <div class="form-group"><label for="custName">نام مشتری</label><input type="text" id="custName" placeholder="نام و نام خانوادگی"></div>
      <div class="form-group"><label for="custPhone">شماره تماس</label><input type="tel" id="custPhone" placeholder="0912xxxxxxx" dir="ltr" style="text-align:left;"></div>
      <div class="form-group"><label for="payMethod">روش پرداخت</label><select id="payMethod"><option value="cash">نقد</option><option value="card">کارتخوان</option><option value="transfer">انتقال بانکی</option></select></div>
    </div>
    <div class="modal__footer"><button class="btn-secondary" id="checkoutCancel">انصراف</button><button class="btn-primary" id="checkoutConfirm">تأیید و ثبت سفارش</button></div>
  </div>
</div>

<nav class="mobile-nav">
  <a class="mobile-nav__item active" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>خانه</span></a>
  <button class="mobile-nav__item" id="mobileCartBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>سبد</span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
const PRODUCTS=[
{id:'1',name:'لنت ترمز جلو پراید',sku:'LNT-PRY-001',brand:'آسیا',category:'ترمز',price:185000,stock:24,unit:'جفت'},
{id:'2',name:'فیلتر روغن پراید',sku:'FLT-OL-P01',brand:'فلیپ',category:'موتور',price:45000,stock:80,unit:'عدد'},
{id:'3',name:'فیلتر هوا پراید',sku:'FLT-AIR-P1',brand:'فلیپ',category:'موتور',price:38000,stock:65,unit:'عدد'},
{id:'4',name:'شمع موتور NGK پراید',sku:'SHM-NGK-P1',brand:'NGK',category:'موتور',price:72000,stock:40,unit:'عدد'},
{id:'5',name:'تسمه دینام پراید',sku:'TSM-DN-P01',brand:'دایMOV',category:'موتور',price:55000,stock:30,unit:'عدد'},

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const faNum=n=>n.toLocaleString('fa-IR');
const toman=n=>faNum(n)+' تومان';

function stockLabel(q){if(q===0)return{text:'ناموجود',cls:'out-of-stock'};if(q<=10)return{text:fa(q)+' موجود',cls:'low-stock'};return{text:'موجود',cls:'in-stock'}}

let cart=[];
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0)}
function cartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}

function addToCart(p){const e=cart.find(i=>i.id===p.id);if(e)e.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1,unit:p.unit});renderCart();showToast(p.name+' به سبد اضافه شد')}
function removeFromCart(id){cart=cart.filter(i=>i.id!==id);renderCart()}
function changeQty(id,d){const i=cart.find(x=>x.id===id);if(i){i.qty=Math.max(1,i.qty+d);renderCart()}}

let toastTimer;
function showToast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}

function renderProducts(list){
  const g=document.getElementById('productGrid');
  if(!list.length){g.innerHTML='<div class="empty-state"><div class="empty-state__icon">🔍</div><div class="empty-state__text">محصولی یافت نشد</div></div>';document.getElementById('productsCount').textContent='';return}
  document.getElementById('productsCount').textContent=fa(list.length)+' محصول';
  g.innerHTML=list.map(p=>{const sl=stockLabel(p.stock);const o=p.stock===0?' out-of-stock':'';return`<article class="p-card${o}" data-id="${p.id}"><div class="p-card__img"><span class="p-card__img-placeholder">🔧</span><span class="p-card__stock-badge ${sl.cls}">${sl.text}</span></div><div class="p-card__body"><span class="p-card__brand">${p.brand}</span><h3 class="p-card__name">${p.name}</h3><span class="p-card__sku">${p.sku}</span><div class="p-card__footer"><div><span class="p-card__price">${faNum(p.price)}</span><span class="p-card__price-unit"> ریال / ${p.unit}</span></div><button class="p-card__add-btn" onclick="handleAdd('${p.id}')" ${p.stock===0?'disabled':''}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button></div></div></article>`}).join('')}

function handleAdd(id){const p=PRODUCTS.find(x=>x.id===id);if(p&&p.stock>0){addToCart(p);const b=document.querySelector(`.p-card[data-id="${id}"] .p-card__add-btn`);if(b){b.classList.add('added');b.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';setTimeout(()=>{b.classList.remove('added');b.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14"/><path d="M5 12h14"/></svg>'},600)}}}

function renderCart(){
  const badge=document.getElementById('cartBadge');const items=document.getElementById('cartItems');const empty=document.getElementById('cartEmpty');const footer=document.getElementById('cartFooter');const c=cartCount();
  badge.textContent=c>0?fa(c):'';
  if(!cart.length){empty.style.display='';footer.style.display='none';items.querySelectorAll('.cart-item').forEach(e=>e.remove());return}
  empty.style.display='none';footer.style.display='';
  items.querySelectorAll('.cart-item').forEach(e=>e.remove());
  items.insertAdjacentHTML('beforeend',cart.map(i=>`<div class="cart-item" data-id="${i.id}"><div class="cart-item__img"><span style="font-size:1.5rem">🔧</span></div><div class="cart-item__info"><div class="cart-item__name">${i.name}</div><div class="cart-item__price">${faNum(i.price*i.qty)} ریال</div><div class="cart-item__controls"><button class="cart-qty-btn" onclick="changeQty('${i.id}',1)">+</button><span class="cart-item__qty">${fa(i.qty)}</span><button class="cart-qty-btn" onclick="changeQty('${i.id}',-1)">−</button><button class="cart-item__remove" onclick="removeFromCart('${i.id}')">حذف</button></div></div></div>`).join(''));
  document.getElementById('cartSubtotal').textContent=faNum(cartTotal());
  document.getElementById('cartTotal').textContent=toman(cartTotal())}

function buildCategories(){const c=[...new Set(PRODUCTS.map(p=>p.category))];const b=document.getElementById('catBar');c.forEach(x=>{const btn=document.createElement('button');btn.className='cat-bar__chip';btn.dataset.cat=x;btn.textContent=x;b.appendChild(btn)})}

let activeCat='all',searchQuery='';
function getFiltered(){let l=PRODUCTS;if(activeCat!=='all')l=l.filter(p=>p.category===activeCat);if(searchQuery){const q=searchQuery.toLowerCase();l=l.filter(p=>p.name.includes(q)||p.sku.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q))}const s=document.getElementById('sortSelect').value;if(s==='cheapest')l.sort((a,b)=>a.price-b.price);else if(s==='expensive')l.sort((a,b)=>b.price-a.price);else if(s==='name')l.sort((a,b)=>a.name.localeCompare(b.name,'fa'));return l}

document.addEventListener('DOMContentLoaded',()=>{
  buildCategories();renderProducts(getFiltered());
  document.getElementById('catBar').addEventListener('click',e=>{const c=e.target.closest('.cat-bar__chip');if(!c)return;document.querySelectorAll('.cat-bar__chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');activeCat=c.dataset.cat;renderProducts(getFiltered())});
  let sd;document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(sd);sd=setTimeout(()=>{searchQuery=e.target.value.trim();renderProducts(getFiltered())},200)});
  document.getElementById('sortSelect').addEventListener('change',()=>renderProducts(getFiltered()));
  const openCart=()=>{document.getElementById('cartDrawer').classList.add('open');document.getElementById('cartOverlay').classList.add('open');document.body.style.overflow='hidden'};
  const closeCart=()=>{document.getElementById('cartDrawer').classList.remove('open');document.getElementById('cartOverlay').classList.remove('open');document.body.style.overflow=''};
  document.getElementById('cartBtn').addEventListener('click',openCart);
  document.getElementById('mobileCartBtn').addEventListener('click',openCart);
  document.getElementById('cartClose').addEventListener('click',closeCart);
  document.getElementById('cartOverlay').addEventListener('click',closeCart);
  const openCheckout=()=>{if(!cart.length)return;closeCart();setTimeout(()=>{document.getElementById('checkoutModal').classList.add('open');document.body.style.overflow='hidden'},300)};
  const closeCheckout=()=>{document.getElementById('checkoutModal').classList.remove('open');document.body.style.overflow=''};
  document.getElementById('checkoutBtn').addEventListener('click',openCheckout);
  document.getElementById('checkoutClose').addEventListener('click',closeCheckout);
  document.getElementById('checkoutCancel').addEventListener('click',closeCheckout);
  document.getElementById('checkoutModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeCheckout()});
  document.getElementById('checkoutConfirm').addEventListener('click',()=>{const n=document.getElementById('custName').value.trim();if(!n){document.getElementById('custName').focus();document.getElementById('custName').style.borderColor='#e74c3c';setTimeout(()=>document.getElementById('custName').style.borderColor='',1500);return}const o=Math.floor(Math.random()*9000)+1000;closeCheckout();cart=[];renderCart();showToast('سفارش شماره '+fa(o)+' ثبت شد ✓');document.getElementById('custName').value='';document.getElementById('custPhone').value=''});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCheckout();closeCart()}});
});
</script>
