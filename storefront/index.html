<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c0392b">
  <meta name="description" content="فروشگاه قطعات خودرو — لوازم یدکی با کیفیت">
  <title>قطعات خودرو | انبار OS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════ HEADER ═══════════ -->
  <header class="header">
    <a href="/" class="header__logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>
      </svg>
      <span>قطعات خودرو</span>
    </a>

    <div class="header__search">
      <svg class="header__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="جستجوی محصول، برند یا شماره فنی..." autocomplete="off">
    </div>

    <div class="header__actions">
      <button class="header__cart-btn" id="cartBtn" aria-label="سبد خرید">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        <span class="header__cart-badge" id="cartBadge"></span>
      </button>
    </div>
  </header>

  <!-- ═══════════ CATEGORY BAR ═══════════ -->
  <nav class="cat-bar">
    <div class="cat-bar__inner" id="catBar">
      <button class="cat-bar__chip active" data-cat="all">همه</button>
    </div>
  </nav>

  <!-- ═══════════ MAIN ═══════════ -->
  <main class="main">
    <div class="products-header">
      <span class="products-header__count" id="productsCount"></span>
      <div class="products-header__sort">
        <select id="sortSelect">
          <option value="newest">جدیدترین</option>
          <option value="cheapest">ارزان‌ترین</option>
          <option value="expensive">گران‌ترین</option>
          <option value="name">نام</option>
        </select>
      </div>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <footer class="footer">
    <p>فروشگاه قطعات خودرو — تمامی حقوق محفوظ است</p>
  </footer>

  <!-- ═══════════ CART DRAWER ═══════════ -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer__header">
      <h2 class="cart-drawer__title">سبد خرید</h2>
      <button class="cart-drawer__close" id="cartClose" aria-label="بستن">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="cart-drawer__items" id="cartItems">
      <div class="cart-empty" id="cartEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        <p>سبد خرید خالی است</p>
      </div>
    </div>
    <div class="cart-drawer__footer" id="cartFooter" style="display:none;">
      <div class="cart-summary">
        <div class="cart-summary__row"><span>جمع کل</span><span id="cartSubtotal">۰</span></div>
        <div class="cart-summary__row total"><span>قابل پرداخت</span><span id="cartTotal">۰ تومان</span></div>
      </div>
      <button class="checkout-btn" id="checkoutBtn">تسویه و خرید</button>
    </div>
  </aside>

  <!-- ═══════════ CHECKOUT MODAL ═══════════ -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title">تسویه خرید</h3>
        <button class="cart-drawer__close" id="checkoutClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="modal__body">
        <div class="form-group"><label for="custName">نام مشتری</label><input type="text" id="custName" placeholder="نام و نام خانوادگی"></div>
        <div class="form-group"><label for="custPhone">شماره تماس</label><input type="tel" id="custPhone" placeholder="0912xxxxxxx" dir="ltr" style="text-align:left;"></div>
        <div class="form-group"><label for="payMethod">روش پرداخت</label>
          <select id="payMethod"><option value="cash">نقد</option><option value="card">کارتخوان</option><option value="transfer">انتقال بانکی</option></select>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn-secondary" id="checkoutCancel">انصراف</button>
        <button class="btn-primary" id="checkoutConfirm">تأیید و ثبت سفارش</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ MOBILE NAV ═══════════ -->
  <nav class="mobile-nav">
    <a class="mobile-nav__item active" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>خانه</span></a>
    <button class="mobile-nav__item" id="mobileCartBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>سبد</span></button>
  </nav>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
