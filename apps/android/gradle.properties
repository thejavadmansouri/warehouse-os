# -Duser.language/country are load-bearing, not cosmetics.
#
# This machine's JVM default locale is fa-IR, so the Kotlin compile daemon wrote its
# rendezvous files with Persian digits (kotlin-daemon.۲۰۲۶-۰۹-۱۲…log) and the Gradle
# side then failed to find/connect to it: the daemon started, listened, saw "No more
# clients left", and shut down — every build spent ~13 minutes on 4 connect retries
# before falling back to slow in-process compilation. Pinning both JVMs to en-US makes
# the daemon handshake match, so Kotlin actually compiles in the daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
